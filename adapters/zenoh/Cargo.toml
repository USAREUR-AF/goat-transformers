# Built outside the adapters workspace: see README.md in this directory.
[package]
name = "goat-adapters-zenoh"
version = "0.1.1"
edition = "2021"
description = "Zenoh transport adapter for goat-transformers. The only crate here with third-party dependencies."
license = "Apache-2.0"

[lib]
name = "goat_adapters_zenoh"
path = "src/lib.rs"

[[bin]]
name = "goat-xf-pipe-zenoh"
path = "src/main.rs"

[dependencies]
goat-adapters-core = { path = "../core" }
goat-adapters-std = { path = "../std" }
zenoh = { version = "=1.9.0", default-features = false, features = ["transport_tcp", "transport_udp", "transport_tls"] }

# Its own workspace, so `cargo build` in `adapters/` never resolves zenoh.
[workspace]
