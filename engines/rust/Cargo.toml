[package]
name = "goat-transformers"
version = "0.8.0"
edition = "2021"
description = "Convert messages between formats that are described by data files (packs): Cursor on Target, GeoJSON, SAPIENT, MAVLink, NMEA 2000, ADS-B and others. Reference engine, standard library only."
license = "Apache-2.0"
repository = "https://github.com/USAREUR-AF/goat-transformers"
homepage = "https://github.com/USAREUR-AF/goat-transformers"
documentation = "https://github.com/USAREUR-AF/goat-transformers/blob/main/docs/using.md"
readme = "README.md"
keywords = ["cot", "geojson", "sapient", "mavlink", "transform"]
categories = ["encoding", "parser-implementations"]
# The packaged crate is the engine source and nothing else. Packs and model
# modules are data: vendor the ones you need with `tools/goat-pkg bundle`.
include = ["src/**", "Cargo.toml", "README.md"]

# Engine-spec 0.24: one feature per wire. The default build has all seven;
# `--no-default-features --features xml,json,geojson` leaves the codecs of the
# other wires out of the build. `bits` holds the sequential layout, six-bit
# armor and `encoding uper`; `geojson` needs nothing of `json`.
[features]
default = ["xml", "geojson", "json", "bits", "protobuf", "text", "tlv", "cbor"]
xml = []
geojson = []
json = []
bits = []
protobuf = []
text = []
tlv = []
cbor = []

[[bin]]
name = "goat-xf"
path = "src/main.rs"

[lib]
name = "goat_transformers"
path = "src/lib.rs"

# Engine-spec 0.25, ruling 2: the benchmark over `bench/set.json`. Its set has
# a vector on every wire, so it is built only where all seven are.
[[example]]
name = "bench"
required-features = ["xml", "geojson", "json", "bits", "protobuf", "text", "tlv"]

# `cargo test` (the CI rust job) builds the test profile. Optimisation level 1
# keeps debug assertions and overflow checks on and runs the malformed-input
# test over every wire well inside the job's time limit.
[profile.test]
opt-level = 1
