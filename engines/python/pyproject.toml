[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "goat-transformers"
version = "0.1.0"
description = "Independent Python engine for goat-transformers: data-driven any-to-any message transformation from packs."
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
goat-transformers = "goat_transformers.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
