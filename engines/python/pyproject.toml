[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "goat-transformers"
version = "0.8.0"
description = "Convert messages between formats that are described by data files (packs): Cursor on Target, GeoJSON, SAPIENT, MAVLink, NMEA 2000, ADS-B and others. Independent Python engine, standard library only."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/USAREUR-AF/goat-transformers"
Documentation = "https://github.com/USAREUR-AF/goat-transformers/blob/main/docs/using.md"

[project.scripts]
goat-xf-py = "goat_transformers.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
