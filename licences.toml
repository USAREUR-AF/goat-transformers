url = "https://msi.nga.mil"
commercial = "yes"
share_alike = false
attribution = true
field_of_use = []
distribution = "public"

# A source that states no licence: kept out of `open` until it is resolved.
[licences."LicenseRef-unstated"]
name = "No licence stated by the source"
