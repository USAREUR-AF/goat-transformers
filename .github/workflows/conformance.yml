# Every engine runs every conversion vector and every load vector, and the
# boundary gate reads the whole tree, on every change.
name: conformance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  boundary-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -I tools/boundary-gate
      - name: Every package carries one version
        run: python3 -I tools/release-version.py
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -I -m unittest discover -s tools/tests
  generators:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -I -m unittest discover -s tools/gen/tests
      # No pack generator has its sources in the tree (schema files are not
      # committed), so the scripts checked here are the ones that need none.
      - name: Committed vectors are what their scripts write
        run: |
          for script in tools/gen/conformance-*-vectors.py tools/gen/cot-protobuf-vectors.py tools/gen/protobuf-*-vectors.py tools/gen/ccsds-vectors.py tools/gen/gdl90-vectors.py tools/gen/adsb-vectors.py; do
            python3 -I "$script" --check
          done
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo test
        working-directory: engines/rust
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: engines/go/go.mod
          cache: false
      - run: go test -v ./...
        working-directory: engines/go
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: PYTHONPATH=src python -m unittest discover -s tests
        working-directory: engines/python
      - name: The installed package loads a bundle of two packs
        run: |
          python -m pip install --disable-pip-version-check ./engines/python
          python3 -I tools/goat-pkg bundle --formats cot-xml,geojson --out "$RUNNER_TEMP/goat"
          cd "$RUNNER_TEMP"
          python -c 'from goat_transformers import Engine; print(Engine.from_dir("goat/packs", packs_only=["cot-xml", "geojson"]).formats())' | grep -q "cot-xml"
          goat-xf-py list-formats --packs goat/packs --packs-only geojson | grep -q geojson
  java:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - run: ./build.sh
        working-directory: engines/java
  cpp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # -O2 without NDEBUG: the malformed-input test runs optimized, with assertions kept.
      - run: |
          cmake -S engines/cpp -B "$RUNNER_TEMP/cpp" -DCMAKE_CXX_FLAGS=-O2
          cmake --build "$RUNNER_TEMP/cpp" --parallel
          ctest --test-dir "$RUNNER_TEMP/cpp" --output-on-failure
  erlang:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "27"
          rebar3-version: "3.24"
      - run: ./build.sh && ./run_tests
        working-directory: engines/erlang
      - name: The engine as a rebar3 application
        run: rebar3 compile
        working-directory: engines/erlang
  zig:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.13.0
      - run: zig build test -- ../../packs
        working-directory: engines/zig
      - name: The module another program imports
        run: zig build module-test
        working-directory: engines/zig
  bindings:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Both crates, formatted and free of clippy warnings
        run: |
          for crate in bindings/c bindings/wasm; do
            (cd "$crate" && cargo fmt --check && cargo clippy --release --all-targets -- -D warnings)
          done
      # test.sh needs no flag here: it finds LeakSanitizer in the compiler and
      # sets ASAN_OPTIONS=detect_leaks=1 for its AddressSanitizer runs itself.
      - name: C ABI, shared and static, under the sanitizers, every vector
        run: ./test.sh
        working-directory: bindings/c
      - name: WebAssembly module
        run: |
          rustup target add wasm32-unknown-unknown
          cargo clippy --release --target wasm32-unknown-unknown -- -D warnings
          cargo test --release
          cargo build --release --target wasm32-unknown-unknown
          cargo build --profile small --target wasm32-unknown-unknown
          ls -l target/wasm32-unknown-unknown/release/goat_transformers_wasm.wasm \
                target/wasm32-unknown-unknown/small/goat_transformers_wasm.wasm
        working-directory: bindings/wasm
      - name: Every conversion vector and the wrapper tests, release build
        run: node --test bindings/wasm/test/*.test.mjs
      - name: Every conversion vector and the wrapper tests, small build
        run: node --test bindings/wasm/test/*.test.mjs
        env:
          GT_WASM: bindings/wasm/target/wasm32-unknown-unknown/small/goat_transformers_wasm.wasm
      - name: TypeScript declarations, compiled against a consumer
        run: >
          npx --yes -p typescript@5.9.3 tsc --noEmit --strict --target es2022
          --module nodenext --skipLibCheck false bindings/wasm/test/consumer.ts
      - name: C library installed under a prefix, found by pkg-config
        run: |
          DESTDIR="$RUNNER_TEMP/stage" bindings/c/install.sh /usr/local
          PKG_CONFIG_PATH="$RUNNER_TEMP/stage/usr/local/lib/pkgconfig" pkg-config --modversion goat_transformers
      - name: npm package, packed, installed into a new project and run
        run: |
          bindings/wasm/build.sh
          (cd bindings/wasm && npm pack --pack-destination "$RUNNER_TEMP")
          mkdir "$RUNNER_TEMP/consumer"
          python3 -I tools/goat-pkg bundle --formats cot-xml,geojson --out "$RUNNER_TEMP/consumer/goat"
          cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/usareur-af-goat-transformers-*.tgz
          node --input-type=module -e 'import { loadTree } from "@usareur-af/goat-transformers/node"; const gt = await loadTree("goat", ["cot-xml", "geojson"]); if (gt.formats().join() !== "cot-xml,geojson") process.exit(1);'
      - name: Example host
        run: |
          node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync("packs/canonical-track-v2/vectors/02-to-cot-xml.json","utf8")).input)' \
            | node bindings/wasm/example/translate.mjs | grep -q 'stale="2021-02-27T20:03:00.250Z"'

  adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo test --locked
        working-directory: adapters
      - run: cargo build --locked --release -p goat-adapters-std
        working-directory: adapters
      - name: the adapters workspace has no third-party dependency
        run: |
          if grep -n '^source = ' adapters/Cargo.lock; then
            echo "adapters/Cargo.lock names a crate from a registry; core, std and mqtt are standard library only" >&2
            exit 1
          fi
      - name: goat-xf-pipe converts one message end to end
        working-directory: adapters
        run: |
          out=$(printf '%s\n' 02223132333435363738393031323334353637383930000000 \
            | target/release/goat-xf-pipe --packs ../packs --packs-only \
                --from-format remote-id --in stdin: --in-frame newline,hex \
                --out stdout: --to-format geojson --out-frame newline)
          test "$out" = '{"type":"Feature","geometry":null,"properties":{},"id":"12345678901234567890"}'

  embedded:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: gt-core against the reference engine on every bits vector, fuzz and slicing
        run: cargo test
        working-directory: embedded
      - name: The image for thumbv7em-none-eabihf, its sizes and its stack bound
        run: |
          rustup target add thumbv7em-none-eabihf
          rustup component add llvm-tools
          embedded/measure.sh
          embedded/measure.sh thumbv7em-none-eabihf "gt-core/sqrt gt-core/trig"
      - name: The linked image holds no panic machinery
        run: "! grep -qi panic embedded/target/firmware.map"
