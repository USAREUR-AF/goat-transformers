# Every engine runs every conversion vector and every load vector, and the
# boundary gate reads the whole tree, on every change.
name: conformance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  boundary-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -I tools/boundary-gate
      - name: Every package carries one version
        run: python3 -I tools/release-version.py
  # A change to model/core.def or model/track.def carries an ADR (AGENTS.md,
  # the shared model is governed like the specification).
  model-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: A change to core or track carries a complete ADR
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            python3 -I tools/model-governance.py --base "origin/$BASE"
          else
            python3 -I tools/model-governance.py
          fi
  tools:
    runs-on: ubuntu-latest
    # The last eight green runs on main took 396 to 556 s, within 50 s of the old
    # 10-minute limit; #349's was cancelled at it. 0.93 adds tests and tool vectors.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -I -m unittest discover -s tools/tests
      # Every decoded value of every conversion vector is plausible for its key
      # and every pack that maps a height names its datum; a failure not in
      # tools/model-checks-allow.txt, or a line there that no longer fails,
      # fails the job.
      - name: Decoded values are plausible and heights name a datum
        run: python3 -I tools/model-checks.py --check
      # A blank line inside a table, or a row with another number of cells,
      # breaks the table on GitHub.
      - name: Markdown tables of README.md and docs/ are whole
        run: python3 -I tools/markdown-tables.py
      # Fails only when a pack has no family in tools/catalog-families/.
      # The figure's counts are compared (--check) only in the counts PR.
      - name: Every pack has a family in the catalog figure
        run: python3 -I tools/catalog-figure.py --check-families
      # A route a deployment runs drops no model key without a line in
      # tools/route-coverage.txt that says why (capability report, Ruling 6).
      - name: No declared route drops a key without a written reason
        run: python3 -I tools/route-coverage.py --check
      - name: No pack or module invents time quality (spec 0.32)
        run: python3 -I tools/time-quality-guard.py
      # Every pack and module has one known licence, in its own place; the
      # open profile holds nothing restricted. licences.json and LICENSING.md
      # are written by the counts pull request (--check-current), not here.
      # README.md and site/index.html hold sections written from one source.
      - name: Sections shared by the README and the site are current
        run: python3 -I tools/doc-sections.py --check
      - name: Licences and profiles
        run: python3 -I tools/licences.py --check
      # NOTICE is written from one file per source in tools/notice/entries/;
      # a stale NOTICE is a note (the counts pull request writes it), a
      # paragraph added to NOTICE itself is a failure.
      - name: Third-party notices
        run: python3 -I tools/notice.py --check
      # A vector holds only the members spec/vector-format.md lists for its
      # kind; engines/go reads vectors strictly and refuses any other.
      - name: Vectors hold only the members the spec defines
        run: python3 -I tools/vector-members.py
      - name: REUSE lint
        run: |
          python3 -m pip install --quiet --disable-pip-version-check reuse==6.3.0
          reuse lint
  generators:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -I -m unittest discover -s tools/gen/tests
      # No pack generator has its sources in the tree (schema files are not
      # committed), so the scripts checked here are the ones that need none.
      - name: Committed vectors are what their scripts write
        run: |
          for script in tools/gen/conformance-*-vectors.py tools/gen/cot-protobuf-vectors.py tools/gen/protobuf-*-vectors.py tools/gen/ccsds-vectors.py tools/gen/ccsds-2-vectors.py tools/gen/ccsds-3-vectors.py tools/gen/gdl90-vectors.py tools/gen/adsb-vectors.py tools/gen/drip-vectors.py tools/gen/gtfs-vectors.py tools/gen/nmea0183-vendor-vectors.py tools/gen/gpsd-json-vectors.py tools/gen/nitf-header-vectors.py tools/gen/ietf-headers-vectors.py tools/gen/ietf-options-vectors.py tools/gen/ais-binary-vectors.py tools/gen/ietf-headers-2-vectors.py tools/gen/ietf-headers-4-vectors.py tools/gen/link-headers-vectors.py tools/gen/vda5050-vectors.py tools/gen/cfe-vectors.py tools/gen/ogc-mf-kml-vectors.py tools/gen/ogcapi-coverages-vectors.py; do
            python3 -I "$script" --check
          done
      # Golden vectors from the format's own reference implementation
      # (shared-model hardening, item 2): pymavlink writes the MAVLink 2
      # frames of packs/mavlink2/vectors/golden-*.json, with no engine.
      - name: MAVLink golden vectors are what pymavlink writes
        run: |
          python3 -m venv "$RUNNER_TEMP/pymavlink"
          "$RUNNER_TEMP/pymavlink/bin/pip" install --quiet --disable-pip-version-check pymavlink==2.4.50
          "$RUNNER_TEMP/pymavlink/bin/python" -I tools/gen/golden-pymavlink.py --check
      - name: NMEA 0183 golden vectors are what pynmea2 writes
        run: |
          python3 -m venv "$RUNNER_TEMP/pynmea2"
          "$RUNNER_TEMP/pynmea2/bin/pip" install --quiet --disable-pip-version-check pynmea2==1.19.0
          "$RUNNER_TEMP/pynmea2/bin/python" -I tools/gen/golden-pynmea2.py --check
      # The DBC files are fetched at the commit each pack names and refused
      # unless their SHA-256 is the one its PROVENANCE.md records.
      - name: CAN DBC golden vectors are what cantools writes
        run: |
          python3 -m venv "$RUNNER_TEMP/cantools"
          "$RUNNER_TEMP/cantools/bin/pip" install --quiet --disable-pip-version-check cantools==45.1.1
          "$RUNNER_TEMP/cantools/bin/python" -I tools/gen/golden-cantools.py --check --cache "$RUNNER_TEMP/dbc-cache"
      # opendroneid.c and .h are fetched at the commit the remote-id pack names
      # and refused unless their SHA-256 is the one its PROVENANCE.md records.
      - name: Remote ID golden vectors are what opendroneid-core-c writes
        run: python3 -I tools/gen/golden-opendroneid.py --check
      # pyais and its one dependency are installed from wheels pinned by SHA-256.
      - name: AIS golden vectors are what pyais writes
        run: |
          python3 -m venv "$RUNNER_TEMP/pyais"
          "$RUNNER_TEMP/pyais/bin/pip" install --quiet --disable-pip-version-check --require-hashes -r tools/gen/golden-pyais.txt
          "$RUNNER_TEMP/pyais/bin/python" -I tools/gen/golden-pyais.py --check
      - name: CoT golden vectors are what takproto writes
        run: |
          python3 -m venv "$RUNNER_TEMP/takproto"
          "$RUNNER_TEMP/takproto/bin/pip" install --quiet --disable-pip-version-check --require-hashes -r tools/gen/golden-takproto.txt
          "$RUNNER_TEMP/takproto/bin/python" -I tools/gen/golden-takproto.py --check --cache "$RUNNER_TEMP/takproto-cache"
      # pyModeS is installed from a wheel pinned by SHA-256; its test messages are
      # fetched at the v3.7.0 commit and refused unless their SHA-256 matches.
      - name: ADS-B golden vectors are what pyModeS decodes
        run: |
          python3 -m venv "$RUNNER_TEMP/pymodes"
          "$RUNNER_TEMP/pymodes/bin/pip" install --quiet --disable-pip-version-check --require-hashes -r tools/gen/golden-pymodes.txt
          "$RUNNER_TEMP/pymodes/bin/python" -I tools/gen/golden-pymodes.py --check --cache "$RUNNER_TEMP/pymodes-cache"
  # Spec 0.24: each wire builds alone, and with every wire but it, with no
  # warning; its vectors pass on the build that has it and json. A job of its
  # own: the rust job is near its time limit.
  rust-single-wire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: engines/rust/single-wire-check.sh
  # Engine-spec 0.24: each engine builds and passes its vectors with each wire
  # alone, and builds with every wire but one. One job per engine, beside its
  # suite, so a failing wire names its engine.
  cpp-single-wire:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sh engines/cpp/tests/single-wire.sh
  go-single-wire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: engines/go/go.mod
          cache: false
      - run: sh engines/go/single-wire-check.sh
  python-single-wire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python3 -I engines/python/single-wire-check.py
  java-single-wire:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - run: sh engines/java/single-wire-check.sh
  erlang-single-wire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "27"
          rebar3-version: "3.24"
      - run: sh engines/erlang/single_wire_check.sh
  zig-single-wire:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.13.0
      - run: engines/zig/single-wire-check.sh
  rust:
    runs-on: ubuntu-latest
    # The suite (every vector, the fuzz run, the reduced builds, the benchmark)
    # took 643 to 1,196 s in the last eight green runs, four of them within 5 s
    # of a 20-minute limit; #312 was cancelled at 20m3s with every test passed.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo test
        working-directory: engines/rust
      # Conformance of each profile narrower than everything: the archive of
      # that profile (its packs, modules and vectors only) passes every vector
      # it holds. Skipped while a profile holds every pack.
      - name: Every vector of the open and open+copyleft archives
        run: |
          all=$(python3 -I tools/licences.py --totals | awk '$1 == "everything" {print $2}')
          for profile in open open+copyleft; do
            n=$(python3 -I tools/licences.py --totals | awk -v p="$profile" '$1 == p {print $2}')
            if [ "$n" = "$all" ]; then echo "profile $profile holds every pack ($n): the full run covers it"; continue; fi
            dir="$RUNNER_TEMP/profile-$profile"
            mkdir -p "$dir/engines"
            python3 -I tools/goat-pkg archive --profile "$profile" --vectors --out "$dir.tar.gz"
            tar xzf "$dir.tar.gz" -C "$dir"
            cp -r engines/rust "$dir/engines/rust"
            (cd "$dir/engines/rust" && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/engines/rust/target" cargo test --test vectors)
          done
      # The command-line contract of spec 0.23, run against the tool cargo test built.
      - name: Tool vectors
        run: python3 -I tools/tool-vectors.py -- engines/rust/target/debug/goat-xf
      - name: Capability matrix of tools/matrix-formats.txt
        run: |
          engines/rust/target/debug/goat-xf matrix --packs packs \
            --packs-only "$(grep -v '^#' tools/matrix-formats.txt | paste -sd, -)" > capability-matrix-rust.tsv
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capability-matrix-rust
          path: capability-matrix-rust.tsv
          if-no-files-found: error
      # Spec 0.24: the engine built with only xml, json and geojson passes every
      # vector on those wires, refuses a pack on any other wire by name, and is smaller.
      - name: Reduced build (xml, json, geojson)
        run: engines/rust/reduced-build-check.sh
      # Spec 0.25: the benchmark of bench/set.json. A vector whose output differs
      # from its expect fails the step; the numbers are informative only (ruling 2d).
      - name: Benchmark (bench/set.json)
        run: cargo run --release --quiet --manifest-path engines/rust/Cargo.toml --example bench -- bench/set.json > bench-rust.jsonl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bench-rust
          path: bench-rust.jsonl
          if-no-files-found: error
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: engines/go/go.mod
          cache: false
      - run: go test -v ./...
        working-directory: engines/go
      # The command-line contract of spec 0.23, and the capability matrix of the
      # formats of tools/matrix-formats.txt, which every engine must write alike.
      - name: Tool vectors and the capability matrix
        run: |
          (cd engines/go && go build -o goat-xf ./cmd/goat-xf)
          python3 -I tools/tool-vectors.py -- engines/go/goat-xf
          engines/go/goat-xf matrix --packs packs --packs-only "$(grep -v '^#' tools/matrix-formats.txt | paste -sd, -)" > capability-matrix-go.tsv
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capability-matrix-go
          path: capability-matrix-go.tsv
          if-no-files-found: error
      # Spec 0.24: the engine built with only xml, json and geojson passes every
      # vector on those wires, refuses a pack on any other wire by name, and is smaller.
      - name: Reduced build (xml, json, geojson)
        run: sh engines/go/reduced-check.sh
      # Spec 0.25: the benchmark of bench/set.json. A vector whose output differs
      # from its expect fails the step; the numbers are informative only (ruling 2d).
      - name: Benchmark (bench/set.json)
        run: go -C engines/go run ./cmd/goat-bench ../../bench/set.json > bench-go.jsonl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bench-go
          path: bench-go.jsonl
          if-no-files-found: error
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: PYTHONPATH=src python -m unittest discover -s tests
        working-directory: engines/python
      - name: The installed package loads a bundle of two packs
        run: |
          python -m pip install --disable-pip-version-check ./engines/python
          python3 -I tools/goat-pkg bundle --formats cot-xml,geojson --out "$RUNNER_TEMP/goat"
          cd "$RUNNER_TEMP"
          python -c 'from goat_transformers import Engine; print(Engine.from_dir("goat/packs", packs_only=["cot-xml", "geojson"]).formats())' | grep -q "cot-xml"
          goat-xf-py list-formats --packs goat/packs --packs-only geojson | grep -q geojson
      # The command-line contract of spec 0.23, and the capability matrix of the
      # formats of tools/matrix-formats.txt, which every engine must write alike.
      - name: Tool vectors and the capability matrix
        run: |
          python3 -I tools/tool-vectors.py -- engines/python/goat-xf-py.py
          engines/python/goat-xf-py.py matrix --packs packs --packs-only "$(grep -v '^#' tools/matrix-formats.txt | paste -sd, -)" > capability-matrix-python.tsv
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capability-matrix-python
          path: capability-matrix-python.tsv
          if-no-files-found: error
      # Spec 0.24: the engine built with only xml, json and geojson passes every
      # vector on those wires, refuses a pack on any other wire by name, and is smaller.
      - name: Reduced build (xml, json, geojson)
        run: python3 -I engines/python/reduced-build-check.py
      # Spec 0.25: the benchmark of bench/set.json. A vector whose output differs
      # from its expect fails the step; the numbers are informative only (ruling 2d).
      - name: Benchmark (bench/set.json)
        run: python3 -I engines/python/bench.py > bench-python.jsonl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bench-python
          path: bench-python.jsonl
          if-no-files-found: error
  java:
    runs-on: ubuntu-latest
    # The malformed-input sweep grows with every pack; it is bounded per vector
    # in a follow-up change, and this limit covers it until then.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - run: ./build.sh
        working-directory: engines/java
      # The command-line contract of spec 0.23, and the capability matrix of the
      # formats of tools/matrix-formats.txt, which every engine must write alike.
      - name: Tool vectors and the capability matrix
        run: |
          python3 -I tools/tool-vectors.py -- engines/java/goat-xf-java.sh
          engines/java/goat-xf-java.sh matrix --packs packs --packs-only "$(grep -v '^#' tools/matrix-formats.txt | paste -sd, -)" > capability-matrix-java.tsv
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capability-matrix-java
          path: capability-matrix-java.tsv
          if-no-files-found: error
      # Spec 0.24: the engine built with only xml, json and geojson passes every
      # vector on those wires, refuses a pack on any other wire by name, and is smaller.
      - name: Reduced build (xml, json, geojson)
        run: engines/java/reduced-check.sh
      # Spec 0.25: the benchmark of bench/set.json. A vector whose output differs
      # from its expect fails the step; the numbers are informative only (ruling 2d).
      - name: Benchmark (bench/set.json)
        run: engines/java/bench.sh > bench-java.jsonl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bench-java
          path: bench-java.jsonl
          if-no-files-found: error
  cpp:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # -O2 without NDEBUG: the malformed-input test runs optimized, with assertions kept.
      - run: |
          cmake -S engines/cpp -B "$RUNNER_TEMP/cpp" -DCMAKE_CXX_FLAGS=-O2
          cmake --build "$RUNNER_TEMP/cpp" --parallel
          ctest --test-dir "$RUNNER_TEMP/cpp" --output-on-failure
      # The command-line contract of spec 0.23, and the capability matrix of the
      # formats of tools/matrix-formats.txt, which every engine must write alike.
      - name: Tool vectors and the capability matrix
        run: |
          python3 -I tools/tool-vectors.py -- "$RUNNER_TEMP/cpp/goat-xf"
          "$RUNNER_TEMP/cpp/goat-xf" matrix --packs packs --packs-only "$(grep -v '^#' tools/matrix-formats.txt | paste -sd, -)" > capability-matrix-cpp.tsv
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capability-matrix-cpp
          path: capability-matrix-cpp.tsv
          if-no-files-found: error
      # Spec 0.24: the engine built with only xml, json and geojson passes every
      # vector on those wires, refuses a pack on any other wire by name, and is smaller.
      - name: Reduced build (xml, json, geojson)
        run: sh engines/cpp/tests/reduced-build.sh
      # Spec 0.25: the benchmark of bench/set.json. A vector whose output differs
      # from its expect fails the step; the numbers are informative only (ruling 2d).
      - name: Benchmark (bench/set.json)
        run: cmake -S engines/cpp -B engines/cpp/build-release -DCMAKE_BUILD_TYPE=Release >&2 && cmake --build engines/cpp/build-release --target goat-bench -j >&2 && engines/cpp/build-release/goat-bench bench/set.json > bench-cpp.jsonl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bench-cpp
          path: bench-cpp.jsonl
          if-no-files-found: error
  erlang:
    runs-on: ubuntu-latest
    # The suite runs every vector of every pack; it took 7 to 9 minutes before
    # the UBX packs and reached the old 10-minute limit with them.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "27"
          rebar3-version: "3.24"
      - run: ./build.sh && ./run_tests
        working-directory: engines/erlang
      - name: The engine as a rebar3 application
        run: rebar3 compile
        working-directory: engines/erlang
      # The command-line contract of spec 0.23, and the capability matrix of the
      # formats of tools/matrix-formats.txt, which every engine must write alike.
      - name: Tool vectors and the capability matrix
        run: |
          python3 -I tools/tool-vectors.py -- engines/erlang/goat-xf.sh
          engines/erlang/goat-xf.sh matrix --packs packs --packs-only "$(grep -v '^#' tools/matrix-formats.txt | paste -sd, -)" > capability-matrix-erlang.tsv
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capability-matrix-erlang
          path: capability-matrix-erlang.tsv
          if-no-files-found: error
      # Spec 0.24: the engine built with only xml, json and geojson passes every
      # vector on those wires, refuses a pack on any other wire by name, and is smaller.
      - name: Reduced build (xml, json, geojson)
        run: engines/erlang/reduced_check.sh
      # Spec 0.25: the benchmark of bench/set.json. A vector whose output differs
      # from its expect fails the step; the numbers are informative only (ruling 2d).
      - name: Benchmark (bench/set.json)
        run: engines/erlang/bench.sh > bench-erlang.jsonl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bench-erlang
          path: bench-erlang.jsonl
          if-no-files-found: error
  zig:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.13.0
      - run: zig build test -- ../../packs
        working-directory: engines/zig
      - name: The module another program imports
        run: zig build module-test
        working-directory: engines/zig
      # The command-line contract of spec 0.23, and the capability matrix of the
      # formats of tools/matrix-formats.txt, which every engine must write alike.
      - name: Tool vectors and the capability matrix
        run: |
          (cd engines/zig && zig build cli -Doptimize=ReleaseSafe)
          python3 -I tools/tool-vectors.py -- engines/zig/zig-out/bin/goat-xf
          engines/zig/zig-out/bin/goat-xf matrix --packs packs --packs-only "$(grep -v '^#' tools/matrix-formats.txt | paste -sd, -)" > capability-matrix-zig.tsv
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capability-matrix-zig
          path: capability-matrix-zig.tsv
          if-no-files-found: error
      # Spec 0.24: the engine built with only xml, json and geojson passes every
      # vector on those wires, refuses a pack on any other wire by name, and is smaller.
      - name: Reduced build (xml, json, geojson)
        run: engines/zig/reduced-check.sh
      # Spec 0.25: the benchmark of bench/set.json. A vector whose output differs
      # from its expect fails the step; the numbers are informative only (ruling 2d).
      - name: Benchmark (bench/set.json)
        run: engines/zig/bench.sh > bench-zig.jsonl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bench-zig
          path: bench-zig.jsonl
          if-no-files-found: error
  # The capability matrix as a checked artifact (spec 0.23): the seven engines
  # wrote it from the same packs; it must be the same bytes from all seven.
  capability-matrix:
    needs: [rust, go, python, java, cpp, erlang, zig]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: capability-matrix-*
          merge-multiple: true
      - name: The seven matrices are the same bytes
        run: |
          ls -l capability-matrix-*.tsv
          sha256sum capability-matrix-*.tsv
          test "$(ls capability-matrix-*.tsv | wc -l)" = 7
          test "$(sha256sum capability-matrix-*.tsv | cut -d' ' -f1 | sort -u | wc -l)" = 1
          cp capability-matrix-rust.tsv capability-matrix.tsv
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capability-matrix
          path: capability-matrix.tsv
          if-no-files-found: error
  bindings:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Both crates, formatted and free of clippy warnings
        run: |
          for crate in bindings/c bindings/wasm; do
            (cd "$crate" && cargo fmt --check && cargo clippy --release --all-targets -- -D warnings)
          done
      # test.sh needs no flag here: it finds LeakSanitizer in the compiler and
      # sets ASAN_OPTIONS=detect_leaks=1 for its AddressSanitizer runs itself.
      - name: C ABI, shared and static, under the sanitizers, every vector
        run: ./test.sh
        working-directory: bindings/c
      - name: WebAssembly module
        run: |
          rustup target add wasm32-unknown-unknown
          cargo clippy --release --target wasm32-unknown-unknown -- -D warnings
          cargo test --release
          cargo build --release --target wasm32-unknown-unknown
          cargo build --profile small --target wasm32-unknown-unknown
          ls -l target/wasm32-unknown-unknown/release/goat_transformers_wasm.wasm \
                target/wasm32-unknown-unknown/small/goat_transformers_wasm.wasm
        working-directory: bindings/wasm
      - name: Every conversion vector and the wrapper tests, release build
        run: node --test bindings/wasm/test/*.test.mjs
      - name: Every conversion vector and the wrapper tests, small build
        run: node --test bindings/wasm/test/*.test.mjs
        env:
          GT_WASM: bindings/wasm/target/wasm32-unknown-unknown/small/goat_transformers_wasm.wasm
      - name: TypeScript declarations, compiled against a consumer
        run: >
          npx --yes -p typescript@5.9.3 tsc --noEmit --strict --target es2022
          --module nodenext --skipLibCheck false bindings/wasm/test/consumer.ts
      - name: C library installed under a prefix, found by pkg-config
        run: |
          DESTDIR="$RUNNER_TEMP/stage" bindings/c/install.sh /usr/local
          PKG_CONFIG_PATH="$RUNNER_TEMP/stage/usr/local/lib/pkgconfig" pkg-config --modversion goat_transformers
      - name: npm package, packed, installed into a new project and run
        run: |
          bindings/wasm/build.sh
          (cd bindings/wasm && npm pack --pack-destination "$RUNNER_TEMP")
          mkdir "$RUNNER_TEMP/consumer"
          python3 -I tools/goat-pkg bundle --formats cot-xml,geojson --out "$RUNNER_TEMP/consumer/goat"
          cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/usareur-af-goat-transformers-*.tgz
          node --input-type=module -e 'import { loadTree } from "@usareur-af/goat-transformers/node"; const gt = await loadTree("goat", ["cot-xml", "geojson"]); if (gt.formats().join() !== "cot-xml,geojson") process.exit(1);'
      - name: Example host
        run: |
          node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync("packs/canonical-track-v2/vectors/02-to-cot-xml.json","utf8")).input)' \
            | node bindings/wasm/example/translate.mjs | grep -q 'stale="2021-02-27T20:03:00.250Z"'

  adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo test --locked
        working-directory: adapters
      - run: cargo build --locked --release -p goat-adapters-std
        working-directory: adapters
      - name: the adapters workspace has no third-party dependency
        run: |
          if grep -n '^source = ' adapters/Cargo.lock; then
            echo "adapters/Cargo.lock names a crate from a registry; core, std and mqtt are standard library only" >&2
            exit 1
          fi
      - name: goat-xf-pipe converts one message end to end
        working-directory: adapters
        run: |
          out=$(printf '%s\n' 02223132333435363738393031323334353637383930000000 \
            | target/release/goat-xf-pipe --packs ../packs --packs-only \
                --from-format remote-id --in stdin: --in-frame newline,hex \
                --out stdout: --to-format geojson --out-frame newline)
          test "$out" = '{"type":"Feature","geometry":null,"properties":{},"id":"12345678901234567890"}'

  embedded:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: gt-core against the reference engine on every bits vector, fuzz and slicing
        run: cargo test
        working-directory: embedded
      - name: The image for thumbv7em-none-eabihf, its sizes and its stack bound
        run: |
          rustup target add thumbv7em-none-eabihf
          rustup component add llvm-tools
          embedded/measure.sh
          embedded/measure.sh thumbv7em-none-eabihf "gt-core/sqrt gt-core/trig"
      - name: The linked image holds no panic machinery
        run: "! grep -qi panic embedded/target/firmware.map"

  # Spec 0.25, ruling 2d: one table of the seven benchmark runs of this
  # workflow (each job keeps bench-<engine>.jsonl), in the job summary and as an
  # artifact. Each engine ran on its own runner, so the columns are listed side
  # by side, not compared. The job never fails the run, and no number fails it.
  bench-table:
    needs: [rust, go, python, java, cpp, erlang, zig]
    if: always()
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: bench-*
          merge-multiple: true
          path: bench-runs
      - name: The benchmark table (tools/bench-table.py)
        run: |
          set -- $(for e in rust go cpp zig java erlang python; do [ -f "bench-runs/bench-$e.jsonl" ] && echo "bench-runs/bench-$e.jsonl"; done)
          [ "$#" -gt 0 ] || { echo "no benchmark run to tabulate" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          python3 -I tools/bench-table.py "$@" > bench-table.md
          { echo "### Benchmark, bench/set.json, microseconds per conversion (commit ${GITHUB_SHA::9})"; echo; cat bench-table.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: bench-table
          path: bench-table.md
          if-no-files-found: ignore
