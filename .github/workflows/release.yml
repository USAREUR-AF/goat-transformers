# A tag `v<version>` builds the release files and attaches them to a GitHub
# Release of that tag, with SHA-256 sums and a build provenance attestation.
#
# This workflow publishes to GitHub Releases only. It does not publish to
# crates.io, PyPI, the npm registry or Maven Central, and it holds no token for
# any of them.
#
# The tag must equal the library version (`v0.8.0` for version 0.8.0); the
# first job refuses a tag that does not. The Go module needs a second tag,
# `engines/go/v<version>`, which starts nothing here (docs/using.md).
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: version
        name: The tag names the version every package carries
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          python3 -I tools/release-version.py "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The goat-xf command-line tool and the C library, one row per platform.
  native:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            cli_target: x86_64-unknown-linux-musl
            c_target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            cli_target: aarch64-unknown-linux-musl
            c_target: aarch64-unknown-linux-gnu
          - name: macos-arm64
            runner: macos-latest
            cli_target: aarch64-apple-darwin
            c_target: aarch64-apple-darwin
          - name: macos-x86_64
            runner: macos-latest
            cli_target: x86_64-apple-darwin
            c_target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CLI_TARGET: ${{ matrix.cli_target }}
      C_TARGET: ${{ matrix.c_target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: |
          rustup target add "$CLI_TARGET" "$C_TARGET"
          mkdir -p out
      - name: goat-xf, statically linked on Linux
        run: |
          cargo build --release --locked --bin goat-xf --target "$CLI_TARGET"
          stage="goat-xf-$VERSION-$CLI_TARGET"
          mkdir -p "dist/$stage"
          cp "target/$CLI_TARGET/release/goat-xf" ../../LICENSE ../../NOTICE "dist/$stage/"
          tar -czf "$GITHUB_WORKSPACE/out/$stage.tar.gz" -C dist "$stage"
        working-directory: engines/rust
      - name: C library, shared and static, with the header and a pkg-config file
        run: |
          stage="goat-transformers-c-$VERSION-$C_TARGET"
          GT_TARGET="$C_TARGET" DESTDIR="$RUNNER_TEMP/$stage" bindings/c/install.sh /usr/local
          mkdir -p "$RUNNER_TEMP/$stage/usr/local/share/doc/goat-transformers"
          cp LICENSE NOTICE "$RUNNER_TEMP/$stage/usr/local/share/doc/goat-transformers/"
          tar -czf "out/$stage.tar.gz" -C "$RUNNER_TEMP" "$stage"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.name }}
          path: out/
          if-no-files-found: error

  # What is the same on every platform.
  portable:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: WebAssembly module, the release build and the small build
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          rustup target add wasm32-unknown-unknown
          cargo build --release --locked --target wasm32-unknown-unknown
          ./build.sh
          cp target/wasm32-unknown-unknown/release/goat_transformers_wasm.wasm "$GITHUB_WORKSPACE/out/goat_transformers-$VERSION.wasm"
          cp dist/goat_transformers.wasm "$GITHUB_WORKSPACE/out/goat_transformers-$VERSION-small.wasm"
        working-directory: bindings/wasm
      - name: npm package (a tarball; not sent to a registry)
        run: npm pack --pack-destination "$GITHUB_WORKSPACE/out"
        working-directory: bindings/wasm
      - name: Python sdist and wheel
        run: |
          python -m pip install --disable-pip-version-check build==1.2.2.post1
          python -m build --outdir "$GITHUB_WORKSPACE/out"
        working-directory: engines/python
      - name: Java jar
        run: |
          ./build.sh
          cp "build/goat-transformers-$VERSION.jar" "$GITHUB_WORKSPACE/out/"
        working-directory: engines/java
      - name: Model modules and packs, without and with the conformance vectors
        run: |
          python3 -I tools/goat-pkg archive --prefix "goat-transformers-packs-$VERSION" --out "out/packs-$VERSION.tar.gz"
          python3 -I tools/goat-pkg archive --vectors --prefix "goat-transformers-packs-$VERSION" --out "out/packs-$VERSION-with-vectors.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portable
          path: out/
          if-no-files-found: error

  release:
    needs: [version, native, portable]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write      # create the release and attach the files
      id-token: write      # sign the provenance attestation
      attestations: write  # store it
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: out
          merge-multiple: true
      - name: SHA-256 sums
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
        working-directory: out
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-checksums: out/SHA256SUMS
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "goat-transformers $VERSION" --generate-notes out/*
