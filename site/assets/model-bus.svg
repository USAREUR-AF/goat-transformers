<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 372" width="1180" height="372" role="img">
  <title>Every format connects to one shared model, drawn as a bus; private formats in an overlay connect to the same bus</title>
<style>
    :root { --ink:#0f1c26; --quiet:#47575f; --rule:#c3ccd2; --panel:#fbfcfc; --accent:#0a55b3; --soft:#d9e6f6; }
    @media (prefers-color-scheme: dark) { :root { --ink:#e2e9ee; --quiet:#9fb0bb; --rule:#2b3a46; --panel:#101b24; --accent:#74b2ff; --soft:#14304f; } }
    text { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; fill: var(--ink); }
    .s { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .h { font-size: 11px; letter-spacing: 0.08em; fill: var(--quiet); }
    .q { fill: var(--quiet); }
    .a { fill: var(--accent); }
    .b { font-weight: 600; }
    .box { fill: var(--panel); stroke: var(--rule); }
    .key { fill: var(--soft); stroke: var(--accent); }
    .ln { stroke: var(--ink); stroke-width: 1; fill: none; }
    .lq { stroke: var(--quiet); stroke-width: 1; fill: none; }
    .la { stroke: var(--accent); stroke-width: 1; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .head { fill: var(--ink); }
    .n { font-size: 12.5px; }
    .bus { fill: var(--soft); stroke: var(--accent); }
  </style>
  <rect class="bus" x="16" y="158" width="1148" height="56" rx="2"/>
  <text class="s b" x="590.0" y="182" text-anchor="middle" style="font-size:15px">shared model</text>
  <text class="q" x="590.0" y="202" text-anchor="middle" style="font-size:12px">typed keys in fixed units: degrees, meters, meters per second, milliseconds since 1970</text>
  <rect class="box" x="36" y="40" width="148" height="66" rx="2"/>
  <text class="s b n" x="110.0" y="62" text-anchor="middle">Cursor on Target</text>
  <text class="q" x="110.0" y="80" text-anchor="middle" style="font-size:11.5px">xml, protobuf</text>
  <text class="q" x="110.0" y="96" text-anchor="middle" style="font-size:11.5px">3 kinds, 2 packs</text>
  <line class="ln" x1="110.0" y1="106" x2="110.0" y2="158"/>
  <circle cx="110.0" cy="158" r="3.5" style="fill:var(--accent)"/>
  <rect class="box" x="196" y="40" width="148" height="66" rx="2"/>
  <text class="s b n" x="270.0" y="62" text-anchor="middle">GeoJSON</text>
  <text class="q" x="270.0" y="80" text-anchor="middle" style="font-size:11.5px">geojson</text>
  <text class="q" x="270.0" y="96" text-anchor="middle" style="font-size:11.5px">1 kind</text>
  <line class="ln" x1="270.0" y1="106" x2="270.0" y2="158"/>
  <circle cx="270.0" cy="158" r="3.5" style="fill:var(--accent)"/>
  <rect class="box" x="356" y="40" width="148" height="66" rx="2"/>
  <text class="s b n" x="430.0" y="62" text-anchor="middle">NATO Vector Graphics</text>
  <text class="q" x="430.0" y="80" text-anchor="middle" style="font-size:11.5px">xml</text>
  <text class="q" x="430.0" y="96" text-anchor="middle" style="font-size:11.5px">1 kind</text>
  <line class="ln" x1="430.0" y1="106" x2="430.0" y2="158"/>
  <circle cx="430.0" cy="158" r="3.5" style="fill:var(--accent)"/>
  <rect class="box" x="516" y="40" width="148" height="66" rx="2"/>
  <text class="s b n" x="590.0" y="62" text-anchor="middle">Canonical Track v2</text>
  <text class="q" x="590.0" y="80" text-anchor="middle" style="font-size:11.5px">json</text>
  <text class="q" x="590.0" y="96" text-anchor="middle" style="font-size:11.5px">1 kind</text>
  <line class="ln" x1="590.0" y1="106" x2="590.0" y2="158"/>
  <circle cx="590.0" cy="158" r="3.5" style="fill:var(--accent)"/>
  <rect class="box" x="676" y="40" width="148" height="66" rx="2"/>
  <text class="s b n" x="750.0" y="62" text-anchor="middle">SAPIENT v1, v2</text>
  <text class="q" x="750.0" y="80" text-anchor="middle" style="font-size:11.5px">protobuf</text>
  <text class="q" x="750.0" y="96" text-anchor="middle" style="font-size:11.5px">18 kinds, 2 packs</text>
  <line class="ln" x1="750.0" y1="106" x2="750.0" y2="158"/>
  <circle cx="750.0" cy="158" r="3.5" style="fill:var(--accent)"/>
  <rect class="box" x="836" y="40" width="148" height="66" rx="2"/>
  <text class="s b n" x="910.0" y="62" text-anchor="middle">ISA</text>
  <text class="q" x="910.0" y="80" text-anchor="middle" style="font-size:11.5px">protobuf, xml</text>
  <text class="q" x="910.0" y="96" text-anchor="middle" style="font-size:11.5px">22 kinds, 4 packs</text>
  <line class="ln" x1="910.0" y1="106" x2="910.0" y2="158"/>
  <circle cx="910.0" cy="158" r="3.5" style="fill:var(--accent)"/>
  <rect class="box" x="996" y="40" width="148" height="66" rx="2"/>
  <text class="s b n" x="1070.0" y="62" text-anchor="middle">UCI 2.5, 2.6</text>
  <text class="q" x="1070.0" y="80" text-anchor="middle" style="font-size:11.5px">xml, 2 packs</text>
  <text class="q" x="1070.0" y="96" text-anchor="middle" style="font-size:11.5px">1,447 kinds</text>
  <line class="ln" x1="1070.0" y1="106" x2="1070.0" y2="158"/>
  <circle cx="1070.0" cy="158" r="3.5" style="fill:var(--accent)"/>
  <rect class="box" x="36" y="266" width="148" height="66" rx="2"/>
  <text class="s b n" x="110.0" y="288" text-anchor="middle">A-GRA 6.0a</text>
  <text class="q" x="110.0" y="306" text-anchor="middle" style="font-size:11.5px">xml</text>
  <text class="q" x="110.0" y="322" text-anchor="middle" style="font-size:11.5px">860 kinds</text>
  <line class="ln" x1="110.0" y1="214" x2="110.0" y2="266"/>
  <circle cx="110.0" cy="214" r="3.5" style="fill:var(--accent)"/>
  <rect class="box" x="196" y="266" width="148" height="66" rx="2"/>
  <text class="s b n" x="270.0" y="288" text-anchor="middle">NMEA 2000</text>
  <text class="q" x="270.0" y="306" text-anchor="middle" style="font-size:11.5px">bits</text>
  <text class="q" x="270.0" y="322" text-anchor="middle" style="font-size:11.5px">488 kinds, 2 packs</text>
  <line class="ln" x1="270.0" y1="214" x2="270.0" y2="266"/>
  <circle cx="270.0" cy="214" r="3.5" style="fill:var(--accent)"/>
  <rect class="box" x="356" y="266" width="148" height="66" rx="2"/>
  <text class="s b n" x="430.0" y="288" text-anchor="middle">MAVLink 2</text>
  <text class="q" x="430.0" y="306" text-anchor="middle" style="font-size:11.5px">bits, 14 packs</text>
  <text class="q" x="430.0" y="322" text-anchor="middle" style="font-size:11.5px">388 kinds</text>
  <line class="ln" x1="430.0" y1="214" x2="430.0" y2="266"/>
  <circle cx="430.0" cy="214" r="3.5" style="fill:var(--accent)"/>
  <rect class="box" x="516" y="266" width="148" height="66" rx="2"/>
  <text class="s b n" x="590.0" y="288" text-anchor="middle">ADS-B</text>
  <text class="q" x="590.0" y="306" text-anchor="middle" style="font-size:11.5px">bits</text>
  <text class="q" x="590.0" y="322" text-anchor="middle" style="font-size:11.5px">64 kinds, 2 packs</text>
  <line class="ln" x1="590.0" y1="214" x2="590.0" y2="266"/>
  <circle cx="590.0" cy="214" r="3.5" style="fill:var(--accent)"/>
  <rect class="box" x="676" y="266" width="148" height="66" rx="2"/>
  <text class="s b n" x="750.0" y="288" text-anchor="middle">ASTERIX</text>
  <text class="q" x="750.0" y="306" text-anchor="middle" style="font-size:11.5px">bits, 30 packs</text>
  <text class="q" x="750.0" y="322" text-anchor="middle" style="font-size:11.5px">27 categories</text>
  <line class="ln" x1="750.0" y1="214" x2="750.0" y2="266"/>
  <circle cx="750.0" cy="214" r="3.5" style="fill:var(--accent)"/>
  <rect class="box" x="836" y="266" width="148" height="66" rx="2"/>
  <text class="s b n" x="910.0" y="288" text-anchor="middle">Remote ID</text>
  <text class="q" x="910.0" y="306" text-anchor="middle" style="font-size:11.5px">bits</text>
  <text class="q" x="910.0" y="322" text-anchor="middle" style="font-size:11.5px">8 kinds</text>
  <line class="ln" x1="910.0" y1="214" x2="910.0" y2="266"/>
  <circle cx="910.0" cy="214" r="3.5" style="fill:var(--accent)"/>
  <rect class="box dash" x="996" y="266" width="148" height="66" rx="2" style="stroke:var(--quiet)"/>
  <text class="s b n" x="1070.0" y="288" text-anchor="middle">your private formats</text>
  <text class="q" x="1070.0" y="306" text-anchor="middle" style="font-size:11.5px">in an overlay</text>
  <text class="q" x="1070.0" y="322" text-anchor="middle" style="font-size:11.5px">same engines</text>
  <line class="lq dash" x1="1070.0" y1="214" x2="1070.0" y2="266"/>
  <circle cx="1070.0" cy="214" r="3.5" style="fill:var(--quiet)"/>
</svg>
