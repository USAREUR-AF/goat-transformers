# The licence of every file, read by standard tools (`reuse lint`, ScanCode,
# SBOM generators; https://reuse.software) and by tools/licences.py.
#
# This file holds one annotation: the library's code and its restatements are
# Apache-2.0. A pack or a model module whose source allows less says so in its
# own place, so a pull request that adds one never edits a line another pull
# request edits:
#
#   a pack      packs/<name>/REUSE.toml, one annotation for every file of the
#               directory: path = "**", precedence = "override", its
#               SPDX-FileCopyrightText and SPDX-License-Identifier
#   a module    model/<module>.def.license, the REUSE companion file: lines
#               "SPDX-FileCopyrightText: ..." and "SPDX-License-Identifier: ..."
#
# A pack has exactly one licence; its flags and its profile come from
# licences.toml. This default takes precedence "closest", so the nearer
# REUSE.toml or companion file holds where there is one.
version = 1
SPDX-PackageName = "goat-transformers"
SPDX-PackageDownloadLocation = "https://github.com/USAREUR-AF/goat-transformers"

[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2025-2026 U.S. Federal Government (in countries where recognized)"
SPDX-License-Identifier = "Apache-2.0"
